# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for k3dev — single-binary async Rust TUI for local K3s clusters.
# Docs: https://docs.coderabbit.ai/reference/configuration
language: en-US
# Review tone (max 250 chars).
tone_instructions: "Be direct and technical. This is a single-binary async Rust TUI (ratatui/tokio/bollard/kube-rs). Prioritize correctness, concurrency safety, error handling and idiomatic Rust over style nits."
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  # Keep the high-level summary on: CodeRabbit writes a "Summary by CodeRabbit"
  # block into each PR description, which the release workflow harvests into the
  # GitHub Release notes (see scripts/coderabbit-release-notes.sh).
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - master
    ignore_title_keywords:
      - WIP
      - DO NOT MERGE
  path_filters:
    - "!target/**"
    - "!assets/**"
    - "!**/*.lock"
  path_instructions:
    - path: "src/**/*.rs"
      instructions: >-
        Enforce the conventions in CLAUDE.md: never block the main loop with sync I/O
        (spawn a tokio task and send results back as an AppMessage); no unwrap()/expect()
        on production paths (use anyhow::Result with .context(...)); compiled regexes via
        once_cell::sync::Lazy; shared config as Arc<ClusterConfig>; pull progress must stay
        monotonic (new >= old). Flag panics, blocking calls inside async, and missing error
        context. Remember K3s runs with --docker, so pod images live in HOST Docker
        (docker rmi), never containerd/crictl.
    - path: "tests/**/*.rs"
      instructions: >-
        Image-pulling tests must use MCR (mcr.microsoft.com) or Quay (quay.io); Docker Hub's
        anonymous limit is 100 pulls / 6h and is easily exceeded during testing.
    - path: ".github/workflows/**"
      instructions: >-
        Verify action versions are pinned, permissions blocks are least-privilege, and that
        build/release steps stay consistent across the target matrix.
  tools:
    clippy:
      enabled: true
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
